<!doctype html>
<html lang="en" data-theme="light" data-theme-setting="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Local chat</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip-link" href="#box">Skip to the message box</a>
<div class="app" id="app">
  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="Conversations">
    <div class="sidebar-head">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H6l-3 2 1-4.6A8 8 0 0 1 13 4a8 8 0 0 1 8 8Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg>
        </span>
        <span class="brand-name">Local chat</span>
      </div>
      <button class="icon-btn sidebar-close" id="closeSidebar" type="button" aria-label="Close conversations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <button class="new-chat" id="new" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14m-7-7h14"/></svg>
      <span>New chat</span>
    </button>

    <nav class="conv-nav" aria-label="Saved conversations">
      <div class="conv-label">Chats</div>
      <ul class="conv-list" id="convList"></ul>
    </nav>

    <div class="sidebar-foot">
      <span class="dot" aria-hidden="true"></span>
      <span>Chats stay in this browser</span>
      <a class="foot-link" id="footLink" href="/settings#sec-chats">Export or import</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open conversations" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="model-wrap">
        <span class="status-dot" id="modelDot" aria-hidden="true"></span>
        <span id="model">Loading</span>
        <span class="model-host" id="hostName"></span>
      </div>
      <div class="top-actions">
        <a class="live-pill" id="liveBtn" href="/monitor" aria-label="Status">
          <span class="live-dot" aria-hidden="true"></span>
          <span class="live-main" id="liveMain">-</span>
          <span class="live-sub" id="liveSub"></span>
        </a>
        <a class="ghost-btn" id="settingsBtn" href="/settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.05V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
          <span>Settings</span>
        </a>
        <div class="theme-wrap">
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme" aria-haspopup="menu" aria-expanded="false" title="Theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          </button>
          <div class="menu" id="themeMenu" role="menu" aria-label="Theme" hidden>
            <button type="button" role="menuitemradio" data-theme-choice="system" aria-checked="false"><span>System</span><span class="check" aria-hidden="true">&#10003;</span></button>
            <button type="button" role="menuitemradio" data-theme-choice="light" aria-checked="false"><span>Light</span><span class="check" aria-hidden="true">&#10003;</span></button>
            <button type="button" role="menuitemradio" data-theme-choice="dark" aria-checked="false"><span>Dark</span><span class="check" aria-hidden="true">&#10003;</span></button>
          </div>
        </div>
      </div>
    </header>

    <main class="log" id="log" role="log" aria-live="polite">
      <div class="thread" id="msgs"></div>
    </main>

    <div class="composer-wrap">
      <form id="form" class="composer-form">
        <div id="note" role="status" aria-live="polite"></div>
        <div class="thumbs" id="thumbs" hidden></div>
        <div class="composer">
          <button class="icon-btn attach" id="attach" type="button" aria-label="Attach images" title="Attach images" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
          <textarea id="box" rows="1" placeholder="Message" aria-label="Message" autofocus></textarea>
          <button id="send" type="submit">Send</button>
        </div>
        <div class="composer-foot">
          <label class="switch" title="Let the model think before it answers: slower, often better on hard questions">
            <input id="think" type="checkbox" role="switch">
            <span class="track" aria-hidden="true"><span class="knob"></span></span>
            <span class="switch-text">Thinking</span>
          </label>
          <div class="ctx" id="ctx">
            <span class="ctx-label">Context</span>
            <span class="ctx-bar" id="ctxBar" role="meter" aria-label="Context used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="ctxFill"></i></span>
            <span class="ctx-text" id="ctxText"></span>
          </div>
          <div class="ctx-actions">
            <button type="button" class="mini-btn" id="compactBtn" disabled>Compact</button>
            <button type="button" class="mini-btn" id="clearBtn" title="Start a new chat with the same settings (Ctrl/Cmd+K)" disabled>Clear</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="drop" id="drop" hidden>Drop images to attach</div>

<dialog class="dialog" id="confirmDialog" aria-labelledby="confirmTitle">
  <form method="dialog">
    <h2 id="confirmTitle">Delete chat?</h2>
    <p id="confirmText">This chat will be removed from this computer.</p>
    <div class="dialog-actions">
      <button class="ghost-btn" value="cancel">Cancel</button>
      <button class="danger-btn" id="confirmOk" value="ok">Delete</button>
    </div>
  </form>
</dialog>

<script src="/common.js"></script>
<script src="/vendor/marked-18.1.2/marked.umd.js"></script>
<script src="/vendor/dompurify-3.4.17/purify.min.js"></script>
<script src="/vendor/highlight.js-11.12.0/highlight.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
