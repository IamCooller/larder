   <g id="text_19">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: end; fill: #d95926" x="326.264096" y="79.991964" transform="rotate(-0 326.264096 79.991964)">llama.cpp faster</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #3987e5" x="341.784867" y="79.941182" transform="rotate(-0 341.784867 79.941182)">Larder faster</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #f0efec" x="8.70912" y="97.037581" transform="rotate(-0 8.70912 97.037581)">The model is bigger than memory: what Larder is built for</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #f0efec" x="8.70912" y="313.087814" transform="rotate(-0 8.70912 313.087814)">The model fits in the GPU and RAM: llama.cpp is faster today</text>
   </g>
  </g>
  <g id="text_23">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #f0efec" x="12.096" y="26.132094" transform="rotate(-0 12.096 26.132094)">Larder against llama.cpp: the same model on the same computer</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9.6px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #c3c2b7" x="12.096" y="43.704" transform="rotate(-0 12.096 43.704)">How many times faster, each grid line doubles. The faded part of a bar: the spread over prompt lengths or runs.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 7.6px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #c3c2b7" transform="translate(12.096 435.5384)">llama.cpp b11719 at the fastest setting of a sweep; quality not compared. Mac, 16 GB M4, 2026-11-06, one run per cell, not like for</text>
   <text style="font-size: 7.6px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #c3c2b7" transform="translate(12.096 443.9402)">like: Larder ran a mixed 4/2-bit research pack (about 3 bits) with the model's MTP head, from the internal SSD plus about 11 GB a</text>
   <text style="font-size: 7.6px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #c3c2b7" transform="translate(12.096 452.244625)">request from an external USB4 SSD; llama.cpp ran a 4.25-bit IQ4_XS from that external SSD alone; 1k, 4k and 16k prompts.</text>
   <text style="font-size: 7.6px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #c3c2b7" transform="translate(12.096 460.54905)">PC, RTX 5060 Ti 16 GB, 15 GB RAM. Qwen3.8-Flash-Next, 2026-11-06: Larder's 4-bit research pack (60.9 GB of experts) against unsloth's UD-Q4_K_XL</text>
   <text style="font-size: 7.6px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #c3c2b7" transform="translate(12.096 468.95085)">(77 GB), exact routing on both sides; stock llama.cpp swapped past the memory guard while loading, so its row is llama.cpp with</text>
   <text style="font-size: 7.6px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #c3c2b7" transform="translate(12.096 477.2814)">Larder's expert store patched in; short and 8k prompts, the first token at 8k one run. 35B: the launcher's 4-bit pack and plan (2026-11-07, two runs) against a</text>
   <text style="font-size: 7.6px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #c3c2b7" transform="translate(12.096 485.6832)">Q4_0 GGUF (2026-11-06); short and 8k prompts.</text>
  </g>
 </g>
